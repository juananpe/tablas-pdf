# HTTP bootstrap. certbot --nginx adds HTTPS and a redirect after DNS is ready.
server {
    listen 80;
    listen [::]:80;
    server_name tablas.ikasten.dev;

    access_log /var/log/nginx/tablas.ikasten.dev.access.log;
    error_log /var/log/nginx/tablas.ikasten.dev.error.log;
    client_max_body_size 52M;

    location / {
        proxy_pass http://127.0.0.1:8766;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
